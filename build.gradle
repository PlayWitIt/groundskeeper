plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// CoreCheck is a plain main() check of the game-free parts, not JUnit; run it as part of the build.
tasks.register('coreCheck', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.greysworkshop.groundskeeper.CoreCheck'
}
tasks.named('test') {
	failOnNoDiscoveredTests = false
	dependsOn 'coreCheck'
}

// The scripted self-test is for development only.
jar {
	exclude 'com/greysworkshop/groundskeeper/SelfTest*'
	exclude 'com/greysworkshop/groundskeeper/AreaTest*'
}

loom {
	runs {
		selfTest {
			client()
			name = "Self Test"
			vmArgs "-Dgroundskeeper.selftest=true", "-Dgroundskeeper.debug=true", "-Xmx1536m"
			runDir "run"
		}
		areaTest {
			client()
			name = "Area Test"
			vmArgs "-Dgroundskeeper.selftest=area", "-Dgroundskeeper.debug=true", "-Xmx1536m"
			runDir "run"
		}
	}
}
